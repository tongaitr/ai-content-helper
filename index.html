<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Helper</title>
    
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- นำเข้า Google Fonts (Kanit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- กำหนด Font เริ่มต้น -->
    <style>
        body {
            font-family: 'Kanit', sans-serif;
        }
    </style>

    <!-- นำเข้า React และ ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- นำเข้า Babel สำหรับแปลง JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Key จะถูกใส่โดย Environment อัตโนมัติ (ไม่ต้องแก้ไขส่วนนี้)
        const apiKey = "";

        // --- สร้าง Icon Components แบบฝังในตัวเพื่อทดแทน lucide-react ---
        const Icon = ({ children, size = 24, className = '' }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Activity = (props) => <Icon {...props}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></Icon>;
        const Search = (props) => <Icon {...props}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></Icon>;
        const Loader2 = ({className = '', ...props}) => <Icon {...props} className={`animate-spin ${className}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></Icon>;
        const AlertCircle = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></Icon>;
        const Target = (props) => <Icon {...props}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></Icon>;
        const List = (props) => <Icon {...props}><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></Icon>;
        const TrendingUp = (props) => <Icon {...props}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></Icon>;
        const FileText = (props) => <Icon {...props}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></Icon>;
        const Lightbulb = (props) => <Icon {...props}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1.3.5 2.6 1.5 3.5.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></Icon>;
        const CheckCircle = (props) => <Icon {...props}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></Icon>;

        // --- Main App Component ---
        function App() {
            const [keyword, setKeyword] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            // ฟังก์ชันเรียก API พร้อม Exponential Backoff ที่ปรับปรุงเรื่องการจัดการ Error
            const fetchWithRetry = async (url, options, retries = 5) => {
                const delays = [1000, 2000, 4000, 8000, 16000];
                for (let i = 0; i < retries; i++) {
                    try {
                        const response = await fetch(url, options);
                        const responseData = await response.json();
                        
                        if (!response.ok) {
                            // ดึงข้อความ Error จาก API กลับมาให้แสดงผลชัดเจนขึ้น
                            throw new Error(responseData.error?.message || `HTTP error! status: ${response.status}`);
                        }
                        return responseData;
                    } catch (err) {
                        if (i === retries - 1) throw err;
                        // รอตามเวลาที่กำหนดก่อนลองใหม่
                        await new Promise(res => setTimeout(res, delays[i]));
                    }
                }
            };

            const handleGenerate = async (e) => {
                e.preventDefault();
                if (!keyword.trim()) return;

                setLoading(true);
                setError(null);
                setResult(null);

                const systemInstruction = `คุณคือผู้เชี่ยวชาญด้าน SEO และ Content Creator ระดับแนวหน้า
หน้าที่ของคุณคือวิเคราะห์ Keyword ที่ผู้ใช้ป้อนเข้ามา โดยมีกฎเหล็กดังนี้:
1. **ต้องใช้ข้อมูลล่าสุดจาก Google Search เสมอ** เพื่อค้นหาข่าวสาร ข้อมูล หรือเหตุการณ์ "ล่าสุด ณ วันนี้" ที่เกี่ยวข้องกับ Keyword นั้นๆ (โดยเฉพาะคีย์เวิร์ดที่เป็นชื่อบุคคล, ข่าวดัง, หรือเหตุการณ์ปัจจุบัน)
2. วิเคราะห์ Search Intent (ความตั้งใจในการค้นหา) ตามบริบทปัจจุบัน
3. วิเคราะห์หัวข้อที่คู่แข่งในหน้าแรกของ Google มักจะเขียนถึง
4. แนะนำโครงสร้างบทความและคำคีย์เวิร์ดที่ควรมี
ให้วิเคราะห์อย่างลึกซึ้งและตอบกลับเป็นภาษาไทย ตามรูปแบบ JSON ที่กำหนดไว้เท่านั้น`;

                const userPrompt = `โปรดค้นหาข่าวล่าสุดและวิเคราะห์ Keyword: "${keyword}" อย่างละเอียดที่สุด`;

                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    // เปิดใช้งาน Google Search Grounding เพื่อดึงข้อมูล Real-time
                    tools: [{ "google_search": {} }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                latestContext: { 
                                    type: "STRING", 
                                    description: "สรุปข่าวล่าสุด เหตุการณ์ปัจจุบัน หรือบริบทอัปเดตล่าสุดที่เกี่ยวกับคีย์เวิร์ดนี้ จากผลการค้นหา Google" 
                                },
                                searchIntent: { 
                                    type: "STRING", 
                                    description: "อธิบายว่าผู้คนที่ค้นหาคำนี้ ต้องการหาข้อมูลประเภทใด (เช่น หาข้อมูล, ต้องการซื้อ, หรือติดตามข่าว) และเพราะอะไร" 
                                },
                                competitorThemes: { 
                                    type: "ARRAY", 
                                    items: { type: "STRING" }, 
                                    description: "หัวข้อหลักที่เว็บไซต์คู่แข่งหรือสำนักข่าวอื่นๆ นำเสนอเกี่ยวกับคีย์เวิร์ดนี้ (3-5 ข้อ)" 
                                },
                                contentOutline: { 
                                    type: "ARRAY", 
                                    items: { type: "STRING" }, 
                                    description: "แนะนำโครงสร้างบทความ (H2/H3) ที่ควรเขียนเพื่อให้ครอบคลุมและตอบโจทย์ SEO (4-6 ข้อ)" 
                                },
                                recommendedKeywords: { 
                                    type: "ARRAY", 
                                    items: { type: "STRING" }, 
                                    description: "คำคีย์เวิร์ดที่เกี่ยวข้อง (LSI Keywords) หรือคำที่มักใช้ร่วมกันในข่าว/บทความนี้ (5-8 คำ)" 
                                },
                                optimizationTips: { 
                                    type: "ARRAY", 
                                    items: { type: "STRING" }, 
                                    description: "คำแนะนำเพิ่มเติมในการเขียน เช่น Mood & Tone, การตั้งชื่อเรื่องให้น่าสนใจ, สิ่งที่ควรระวัง" 
                                }
                            },
                            required: ["latestContext", "searchIntent", "competitorThemes", "contentOutline", "recommendedKeywords", "optimizationTips"]
                        }
                    }
                };

                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                    const data = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    
                    if (!responseText) {
                        throw new Error("ไม่ได้รับข้อมูลการวิเคราะห์ที่สมบูรณ์จาก AI");
                    }

                    // ป้องกันปัญหากรณี AI ส่งข้อความมาพร้อมกับ Markdown ```json ... ```
                    let cleanedText = responseText.trim();
                    if (cleanedText.startsWith("```json")) {
                        cleanedText = cleanedText.replace(/^```json/, "");
                    }
                    if (cleanedText.endsWith("```")) {
                        cleanedText = cleanedText.replace(/```$/, "");
                    }
                    cleanedText = cleanedText.trim();

                    const parsedResult = JSON.parse(cleanedText);
                    setResult(parsedResult);
                    
                } catch (err) {
                    console.error("API Fetch Error:", err);
                    setError(err.message || "เกิดข้อผิดพลาดในการดึงข้อมูล โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ตหรือลองอีกครั้ง");
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 text-slate-800 p-4 md:p-8">
                <div className="max-w-5xl mx-auto space-y-8">
                    
                    {/* Header */}
                    <div className="text-center space-y-3 mt-8">
                    <div className="inline-flex items-center justify-center p-3 bg-blue-100 text-blue-600 rounded-full mb-2 shadow-sm">
                        <Activity size={32} />
                    </div>
                    <h1 className="text-4xl md:text-5xl font-bold text-slate-900 tracking-tight">
                        AI Content Helper
                    </h1>
                    <p className="text-lg text-slate-600 max-w-2xl mx-auto mt-4">
                        ใส่คีย์เวิร์ดเพียงคลิกเดียว ระบบจะดึงข้อมูลที่อัปเดตที่สุด วิเคราะห์เจตนาการค้นหา คู่แข่ง และแนะแนวทางการเขียนบทความให้ตอบโจทย์ SEO ทันที
                    </p>
                    </div>

                    {/* Search Input Section */}
                    <form onSubmit={handleGenerate} className="max-w-2xl mx-auto relative mt-8">
                    <div className="relative flex items-center">
                        <div className="absolute left-4 text-slate-400">
                            <Search size={24} />
                        </div>
                        <input
                        type="text"
                        value={keyword}
                        onChange={(e) => setKeyword(e.target.value)}
                        placeholder="ป้อนคีย์เวิร์ด เช่น 'ทรายสก๊อต', 'iPhone 16'..."
                        className="w-full pl-12 pr-32 py-4 rounded-2xl border-2 border-slate-200 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 text-lg shadow-sm outline-none transition-all"
                        disabled={loading}
                        />
                        <button
                        type="submit"
                        disabled={loading || !keyword.trim()}
                        className="absolute right-2 top-2 bottom-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white px-6 rounded-xl font-medium transition-colors flex items-center gap-2"
                        >
                        {loading ? <Loader2 size={20} /> : 'วิเคราะห์'}
                        </button>
                    </div>
                    </form>

                    {/* Error Message */}
                    {error && (
                    <div className="max-w-2xl mx-auto p-4 bg-red-50 text-red-600 rounded-xl flex items-center gap-3 border border-red-100">
                        <AlertCircle size={24} className="flex-shrink-0" />
                        <p className="font-medium">{error}</p>
                    </div>
                    )}

                    {/* Loading State */}
                    {loading && (
                    <div className="py-20 flex flex-col items-center justify-center text-slate-500 space-y-6">
                        <div className="relative">
                        <div className="w-16 h-16 border-4 border-blue-200 rounded-full animate-pulse"></div>
                        <div className="w-16 h-16 border-4 border-blue-600 rounded-full animate-spin absolute top-0 left-0 border-t-transparent"></div>
                        </div>
                        <p className="text-lg animate-pulse font-medium">กำลังค้นหาข่าวล่าสุดและวิเคราะห์ข้อมูลลึกซึ้ง...</p>
                    </div>
                    )}

                    {/* Results Section */}
                    {result && !loading && (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in fade-in slide-in-from-bottom-4 duration-500 pb-12">
                        
                        {/* บริบทล่าสุด & Intent */}
                        <div className="col-span-1 md:col-span-2 bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 space-y-6">
                        <div className="space-y-4">
                            <div className="flex items-center gap-3 text-blue-600">
                            <Activity size={28} />
                            <h2 className="text-2xl font-bold">บริบทเหตุการณ์ล่าสุด</h2>
                            </div>
                            <div className="bg-blue-50 p-5 rounded-2xl border border-blue-100 text-slate-700 leading-relaxed text-lg whitespace-pre-wrap">
                            {result.latestContext}
                            </div>
                        </div>

                        <div className="space-y-4 pt-4 border-t border-slate-100">
                            <div className="flex items-center gap-3 text-purple-600">
                            <Target size={28} />
                            <h2 className="text-2xl font-bold">Search Intent (เจตนาการค้นหา)</h2>
                            </div>
                            <p className="text-slate-700 leading-relaxed text-lg px-2">
                            {result.searchIntent}
                            </p>
                        </div>
                        </div>

                        {/* โครงสร้างบทความ */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 text-indigo-600 mb-6">
                            <List size={26} />
                            <h3 className="text-xl font-bold">โครงสร้างบทความแนะนำ (Outline)</h3>
                        </div>
                        <ul className="space-y-4">
                            {result.contentOutline && result.contentOutline.map((item, idx) => (
                            <li key={idx} className="flex items-start gap-3 text-slate-700">
                                <span className="flex-shrink-0 w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold text-sm">
                                H{idx === 0 ? '2' : '2'}
                                </span>
                                <span className="pt-1">{item}</span>
                            </li>
                            ))}
                        </ul>
                        </div>

                        {/* วิเคราะห์คู่แข่ง */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 text-orange-500 mb-6">
                            <TrendingUp size={26} />
                            <h3 className="text-xl font-bold">หัวข้อหลักที่คู่แข่งเขียนถึง</h3>
                        </div>
                        <ul className="space-y-3">
                            {result.competitorThemes && result.competitorThemes.map((item, idx) => (
                            <li key={idx} className="flex items-start gap-3 text-slate-700">
                                <div className="mt-2 flex-shrink-0 w-2 h-2 rounded-full bg-orange-400"></div>
                                <span>{item}</span>
                            </li>
                            ))}
                        </ul>
                        </div>

                        {/* คีย์เวิร์ดแนะนำ */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 text-emerald-600 mb-6">
                            <FileText size={26} />
                            <h3 className="text-xl font-bold">คีย์เวิร์ด & LSI ที่ควรมีในบทความ</h3>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {result.recommendedKeywords && result.recommendedKeywords.map((keyword, idx) => (
                            <span key={idx} className="px-4 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-sm font-medium">
                                {keyword}
                            </span>
                            ))}
                        </div>
                        </div>

                        {/* คำแนะนำในการปรับแต่ง */}
                        <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                        <div className="flex items-center gap-3 text-amber-500 mb-6">
                            <Lightbulb size={26} />
                            <h3 className="text-xl font-bold">คำแนะนำ / ข้อควรระวังเพิ่มเติม</h3>
                        </div>
                        <ul className="space-y-3">
                            {result.optimizationTips && result.optimizationTips.map((tip, idx) => (
                            <li key={idx} className="flex items-start gap-3 text-slate-700 bg-amber-50/50 p-3 rounded-xl border border-amber-100/50">
                                <CheckCircle className="flex-shrink-0 text-amber-500 mt-0.5" size={20} />
                                <span>{tip}</span>
                            </li>
                            ))}
                        </ul>
                        </div>

                    </div>
                    )}
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
